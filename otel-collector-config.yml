receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  # Optional: Sample traces for cost reduction
  probabilistic_sampler:
    sampling_percentage: 100

exporters:
  # Export to local Jaeger for development
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true

  # Export to Prometheus for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Optional: Export to cloud backend like Arize/DataDog
  otlp/export:
    endpoint: your-observability-backend:4317

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, probabilistic_sampler]
      exporters: [jaeger, otlp/export]
    
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
